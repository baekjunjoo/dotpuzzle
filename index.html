<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DotPuzzle Pack — Daily Tactile Puzzles</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      /* Heap-inspired light palette */
      --bg-app: #fafafa;
      --bg-card: #ffffff;
      --bg-soft: #f3f3f1;
      --line: #e8e8e6;
      --line-soft: #f0f0ee;
      --fg: #0a0a0a;
      --fg-soft: #4a4a4a;
      --fg-dim: #6d6d6d;   /* WCAG AA 5:1 on white (was #8a8a8a = 3.93:1) */
      --fg-faint: #949494; /* WCAG 1.4.11 3.1:1 on white (was #c5c5c3 = 1.86:1) — UI/borders only */
      --dot: #0a0a0a;
      /* Game accents */
      --c-sudoku: #7fb2e8;
      --c-sudoku-soft: #d4e7f9;
      --c-mine: #f5b5bd;
      --c-mine-soft: #fde0e3;
      --c-nono: #f5c957;
      --c-nono-soft: #fdf0c8;
      --c-maze: #67b87b;
      --c-maze-soft: #d4ecd9;
      --accent: var(--c-sudoku);
      /* status */
      --ok: #3a8d4f;
      --danger: #d04848;
      --info: #4a8fcf;
    }
    * { box-sizing: border-box; }

    /* ============ A11Y v0.7 — WCAG 2.4.7 ============ */
    button:focus-visible,
    [role="button"]:focus-visible,
    [role="grid"]:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--dot) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 0 1px var(--bg-card), 0 0 0 4px var(--dot) !important;
    }
    /* Skip link */
    .skip-link {
      position: fixed; top: -100px; left: 16px; z-index: 9999;
      background: var(--fg); color: var(--bg-card);
      padding: 12px 20px; font-weight: 700; font-size: 14px;
      text-decoration: none; border-radius: 999px;
      transition: top 0.15s;
    }
    .skip-link:focus { top: 12px; outline: 3px solid var(--accent); outline-offset: 2px; }
    /* sr-only — visually hidden but for screen readers */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      margin: -1px; overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg-app);
      color: var(--fg);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    /* Web app container — responsive */
    .topbar-sticky {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg-app);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px; margin: -32px -20px 24px;
    }
    @media (max-width: 640px) {
      .topbar-sticky { padding: 12px 16px; margin: -20px -16px 16px; }
    }
    .layout {
      display: grid; grid-template-columns: 1fr;
      gap: 32px; align-items: start;
    }
    @media (min-width: 1100px) {
      .layout.with-side { grid-template-columns: minmax(0, 1fr) 360px; }
    }
    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 64px;
      background: var(--bg-app);
    }
    @media (min-width: 640px) {
      .app { padding: 40px 32px 80px; }
    }
    @media (min-width: 1024px) {
      .app { max-width: 880px; padding: 48px 40px 96px; }
    }
    @media (min-width: 1280px) {
      .app { max-width: 960px; }
    }
    @media (max-width: 400px) {
      .app { padding: 20px 16px 60px; }
    }
    /* Themed game screens — different accent per game */
    body[data-theme="sudoku"], .app[data-theme="sudoku"] { --accent: var(--c-sudoku); --accent-soft: var(--c-sudoku-soft); }
    body[data-theme="minesweeper"], .app[data-theme="minesweeper"] { --accent: var(--c-mine); --accent-soft: var(--c-mine-soft); }
    body[data-theme="nonogram"], .app[data-theme="nonogram"] { --accent: var(--c-nono); --accent-soft: var(--c-nono-soft); }
    body[data-theme="maze"], .app[data-theme="maze"] { --accent: var(--c-maze); --accent-soft: var(--c-maze-soft); }


    /* 헤더 — 모바일에서 줄바꿈 가능 */
    @media (max-width: 480px) {
      .topbar { flex-wrap: wrap; gap: 6px; }
      .header-btns { flex-wrap: wrap; }
      .icon-btn { font-size: 9px; padding: 5px 9px; }
    }
    /* Top bar */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; gap: 8px;
    }
    .brand {
      font-size: 11px; letter-spacing: 0.18em; color: var(--fg-dim);
      font-weight: 700;
    }
    .brand b { color: var(--fg); }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg-soft); font-size: 11px; padding: 10px 14px;
      cursor: pointer; font-family: inherit; letter-spacing: 0.08em;
      border-radius: 999px; font-weight: 600;
      transition: all 0.15s;
      min-height: 44px; min-width: 44px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { border-color: var(--fg-faint); color: var(--fg); }
    .icon-btn.active { background: var(--fg); color: white; border-color: var(--fg); }
    .icon-btn.connected { background: var(--ok); color: white; border-color: var(--ok); }
    .back-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg); font-size: 16px; padding: 10px 14px;
      cursor: pointer; font-family: inherit;
      border-radius: 999px; line-height: 1;
      min-height: 44px; min-width: 44px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .back-btn:hover { background: var(--bg-soft); }

    /* Launcher */
    .launcher-hero {
      background: var(--c-sudoku-soft);
      border-radius: 28px;
      padding: 28px 24px;
      margin-bottom: 20px;
      position: relative; overflow: hidden;
    }
    @media (min-width: 640px) {
      .launcher-hero { padding: 40px 36px; border-radius: 32px; }
    }
    @media (min-width: 1024px) {
      .launcher-hero { padding: 56px 48px; }
    }
    .launcher-hero-dots {
      position: absolute; right: -20px; bottom: -20px;
      width: 200px; height: 100px;
    }
    @media (min-width: 640px) {
      .launcher-hero-dots { width: 280px; height: 140px; right: -10px; bottom: -10px; }
    }
    @media (min-width: 1024px) {
      .launcher-hero-dots { width: 360px; height: 180px; }
    }
    .launcher-hero-dots svg { width: 100%; height: 100%; }
    .launcher-eyebrow {
      font-size: 11px; letter-spacing: 0.18em; color: var(--fg-soft);
      font-weight: 700; margin-bottom: 10px;
    }
    .launcher-title {
      font-size: 30px; font-weight: 800; letter-spacing: -0.02em;
      line-height: 1.1; color: var(--fg);
      margin: 0 0 10px;
    }
    @media (min-width: 640px) { .launcher-title { font-size: 42px; } }
    @media (min-width: 1024px) { .launcher-title { font-size: 56px; } }
    .launcher-sub {
      font-size: 15px; color: var(--fg-soft); line-height: 1.55;
      max-width: 80%;
    }
    @media (min-width: 640px) {
      .launcher-sub { font-size: 16px; }
    }
    .launcher-section-label {
      font-size: 11px; letter-spacing: 0.18em; color: var(--fg-dim);
      font-weight: 700; margin: 14px 4px 12px;
    }

    /* Game card list — 단일 컬럼, 카드 가로 길게 */
    .game-cards-wrap {
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 24px;
    }
    /* Game card — wide horizontal layout */
    .game-card {
      width: 100%;
      background: var(--bg-card); border: 1.5px solid var(--line);
      padding: 18px 18px 18px 20px;
      cursor: pointer; transition: all 0.18s ease;
      text-align: left;
      border-radius: 22px;
      display: flex; gap: 18px; align-items: center;
      font-family: inherit;
      position: relative;
    }
    .game-card:hover {
      border-color: var(--fg-faint);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .game-card:focus-visible {
      border-color: var(--dot);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.12);
    }
    .game-card.dotpad-focus { border-color: var(--dot); box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }

    .game-card-swatch {
      width: 64px; height: 64px; flex-shrink: 0;
      border-radius: 18px;
      display: flex; justify-content: center; align-items: center;
      padding: 10px;
    }
    .game-card-swatch svg { width: 100%; height: 100%; display: block; }
    .swatch-sudoku { background: var(--c-sudoku-soft); }
    .swatch-mine { background: var(--c-mine-soft); }
    .swatch-nono { background: var(--c-nono-soft); }
    .swatch-maze { background: var(--c-maze-soft); }

    .game-card-body { flex: 1; min-width: 0; }
    .game-card-title {
      font-size: 18px; font-weight: 800; color: var(--fg);
      margin-bottom: 6px;
      letter-spacing: -0.015em;
      line-height: 1.2;
    }
    .game-card-sub {
      font-size: 14px; color: var(--fg-soft); line-height: 1.5;
      letter-spacing: -0.005em;
    }

    /* Meta column — chip + arrow stacked on right */
    .game-card-meta {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 10px; flex-shrink: 0;
    }
    .game-card-arrow {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-soft); color: var(--fg);
      display: flex; justify-content: center; align-items: center;
      font-size: 18px; flex-shrink: 0; font-weight: 600;
      transition: all 0.18s;
    }
    .game-card:hover .game-card-arrow {
      background: var(--accent); color: var(--bg-card);
      transform: translateX(2px);
    }

    /* Difficulty chip — 키 차별화 + 더 큰 폰트 */
    .diff-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg-soft); border: 1px solid var(--line);
      color: var(--fg); font-size: 12px; font-weight: 700;
      padding: 6px 12px; border-radius: 999px;
      cursor: pointer; font-family: inherit; letter-spacing: 0.02em;
      transition: all 0.15s;
      line-height: 1;
      white-space: nowrap;
    }
    .diff-chip:hover { background: var(--bg-card); border-color: var(--fg-dim); transform: translateY(-1px); }
    .diff-chip:focus-visible { outline: 2px solid var(--dot); outline-offset: 2px; }
    .diff-chip .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--dot);
      flex-shrink: 0;
    }
    .diff-chip .lbl { font-weight: 700; }
    .diff-chip .hint {
      font-size: 10px; color: var(--fg-dim); font-weight: 500;
      letter-spacing: 0.04em;
    }
    .diff-chip[data-level="easy"] .dot { background: #67b87b; box-shadow: 0 0 0 2px rgba(103,184,123,0.18); }
    .diff-chip[data-level="medium"] .dot { background: #f5c957; box-shadow: 0 0 0 2px rgba(245,201,87,0.22); }
    .diff-chip[data-level="hard"] .dot { background: #d04848; box-shadow: 0 0 0 2px rgba(208,72,72,0.18); }

    @media (max-width: 480px) {
      .game-card { padding: 14px 14px 14px 16px; gap: 12px; border-radius: 18px; }
      .game-card-swatch { width: 52px; height: 52px; padding: 8px; border-radius: 14px; }
      .game-card-title { font-size: 16px; }
      .game-card-sub { font-size: 13px; }
      .game-card-meta { gap: 6px; }
      .game-card-arrow { width: 30px; height: 30px; font-size: 15px; }
      .diff-chip .hint { display: none; }
    }

    /* Helper tools bar (per-game) — 폰트 키움 */
    .tools-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tool-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg); font-size: 13px; font-weight: 600;
      padding: 12px 16px; border-radius: 999px;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
      min-height: 44px;
    }
    .tool-btn:hover { background: var(--bg-soft); border-color: var(--fg-faint); }
    .tool-btn .ico { display: inline-block; margin-right: 5px; }

    /* Game header */
    .game-head {
      background: var(--accent-soft);
      border-radius: 22px;
      padding: 14px 16px 12px;
      margin-bottom: 14px;
      position: relative; overflow: hidden;
    }
    .game-head-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .game-eyebrow {
      font-size: 11px; letter-spacing: 0.15em; color: var(--fg-soft);
      font-weight: 700;
    }
    .game-title {
      font-size: 22px; font-weight: 800; color: var(--fg);
      letter-spacing: -0.01em; line-height: 1.2;
    }
    @media (min-width: 640px) { .game-title { font-size: 26px; } }
    .game-sub {
      font-size: 14px; color: var(--fg-soft);
      line-height: 1.5;
    }

    /* Sudoku */
    .sudoku-grid {
      display: grid; grid-template-columns: repeat(9, 1fr);
      gap: 1px; background: var(--fg-faint);
      border: 2px solid var(--fg);
      margin-bottom: 14px;
      aspect-ratio: 1;
      border-radius: 8px; overflow: hidden;
    }
    .sudoku-cell {
      background: var(--bg-card);
      display: flex; justify-content: center; align-items: center;
      font-size: 14px; font-weight: 700; color: var(--fg);
      cursor: pointer; user-select: none;
      position: relative;
    }
    .sudoku-cell.given { color: var(--fg); background: var(--bg-soft); }
    .sudoku-cell.user { color: var(--info); }
    .sudoku-cell.bad { color: var(--danger); }
    .sudoku-cell.focused { background: var(--accent); color: var(--fg); z-index: 2; }
    /* Box dividers — class-driven for variable sizes */
    .sudoku-cell.box-r { border-right: 2px solid var(--fg); }
    .sudoku-cell.box-b { border-bottom: 2px solid var(--fg); }


    /* iOS-style number pad */
    .num-pad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 12px;
      max-width: 280px;
    }
    .num-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg); padding: 14px 0;
      font-size: 19px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      border-radius: 16px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 1px; transition: all 0.1s;
    }
    .num-btn:hover { background: var(--bg-soft); border-color: var(--fg-faint); }
    .num-btn:active { transform: scale(0.97); background: var(--accent-soft); }
    .num-btn .sub {
      font-size: 8px; letter-spacing: 0.15em; color: var(--fg-dim);
      font-weight: 600;
    }
    .num-btn.dotpad-focus { background: var(--accent); border-color: var(--dot); }
    .num-btn.erase { background: var(--bg-soft); }
    .num-row { display: flex; gap: 8px; }
    .num-row > * { flex: 1; }

    /* Cancel/Done pill bar */
    .pad-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0 12px;
      font-size: 14px; font-weight: 600;
    }
    .pad-bar .cancel { color: var(--info); cursor: pointer; }
    .pad-bar .done { color: var(--info); cursor: pointer; }

    /* Minesweeper */
    .ms-grid {
      display: grid; gap: 1px; background: var(--fg-faint);
      border: 2px solid var(--fg);
      margin-bottom: 12px;
      aspect-ratio: 1;
      border-radius: 8px; overflow: hidden;
    }
    .ms-cell {
      background: var(--bg-soft);
      display: flex; justify-content: center; align-items: center;
      font-size: 11px; font-weight: 700; color: var(--fg);
      cursor: pointer; user-select: none;
    }
    .ms-cell.revealed { background: var(--bg-card); color: var(--fg-soft); }
    .ms-cell.revealed.n1 { color: var(--info); }
    .ms-cell.revealed.n2 { color: var(--ok); }
    .ms-cell.revealed.n3 { color: var(--danger); }
    .ms-cell.revealed.n4 { color: #8a4fb5; }
    .ms-cell.flagged { background: var(--c-mine-soft); }
    .ms-cell.flagged::after { content: '⚑'; color: var(--danger); font-size: 12px; }
    .ms-cell.mine { background: var(--c-mine); }
    .ms-cell.mine::after { content: '●'; color: var(--dot); }
    .ms-cell.focused { background: var(--accent); color: var(--fg); z-index: 2; }
    .ms-status {
      display: flex; justify-content: space-around;
      font-size: 11px; color: var(--fg-soft); margin-bottom: 8px;
      background: var(--bg-card); border: 1px solid var(--line);
      border-radius: 14px; padding: 8px 10px;
    }
    .ms-status b { color: var(--fg); font-weight: 700; }

    /* Nonogram */
    .nono-wrap {
      display: grid; gap: 1px;
      margin-bottom: 12px;
    }
    .nono-hint-cell {
      background: var(--bg-soft); padding: 2px 4px;
      font-size: 9px; color: var(--fg-soft);
      display: flex; align-items: center; line-height: 1.1;
      letter-spacing: 0; font-weight: 600;
    }
    .nono-hint-cell.col { flex-direction: column; justify-content: flex-end; text-align: center; }
    .nono-hint-cell.row { justify-content: flex-end; }
    .nono-grid-area {
      background: var(--fg-faint); border: 2px solid var(--fg);
      border-radius: 4px; overflow: hidden;
    }
    .nono-cell {
      background: var(--bg-card); cursor: pointer; user-select: none;
      display: flex; justify-content: center; align-items: center;
      font-size: 10px; color: var(--fg-dim);
    }
    .nono-cell.filled { background: var(--dot); }
    .nono-cell.x::after { content: '×'; color: var(--fg-dim); font-size: 12px; }
    .nono-cell.focused { box-shadow: inset 0 0 0 2px var(--c-nono); z-index: 2; }

    /* Maze */
    .maze-grid {
      display: grid; gap: 0;
      margin-bottom: 12px;
      aspect-ratio: 1;
      border: 2px solid var(--fg);
      border-radius: 8px; overflow: hidden;
      background: var(--bg-card);
    }
    .maze-cell {
      background: var(--bg-card); position: relative;
    }
    .maze-cell.wall { background: var(--fg); }
    .maze-cell.player::after {
      content: ''; position: absolute; inset: 12%;
      background: var(--c-maze); border-radius: 50%;
      box-shadow: 0 0 0 2px var(--fg);
    }
    .maze-cell.goal::after {
      content: ''; position: absolute; inset: 25%;
      background: var(--accent); border-radius: 50%;
    }
    .maze-controls {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; margin: 0 auto; width: 200px;
    }
    .maze-controls .num-btn { padding: 14px 0; font-size: 16px; }
    .maze-controls .empty { background: transparent; border: none; }

    /* Action buttons */
    .action-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 12px;
    }
    .primary-btn {
      background: var(--fg); color: white; border: none;
      padding: 15px 24px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit; letter-spacing: 0.02em;
      flex: 1; min-width: 130px;
      border-radius: 999px;
      transition: all 0.15s;
    }
    .primary-btn:hover { background: #2a2a2a; transform: translateY(-1px); }
    .primary-btn.dotpad-focus { box-shadow: 0 0 0 3px var(--accent); }
    .ghost-btn {
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--line);
      padding: 14px 22px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      border-radius: 999px;
      transition: all 0.15s;
    }
    .ghost-btn:hover { background: var(--bg-soft); border-color: var(--fg-faint); }
    .ghost-btn.dotpad-focus { border-color: var(--dot); }


    /* 게임 그리드는 max-width로 데스크탑에서 너무 커지지 않게 */
    .sudoku-grid, .ms-grid, .maze-grid {
      max-width: 540px;
      margin-left: auto; margin-right: auto;
    }
    .nono-wrap {
      max-width: 600px;
      margin-left: auto; margin-right: auto;
    }
    /* 모바일에서 num-pad 좀 더 크게 */
    @media (max-width: 480px) {
      .num-pad { max-width: 100%; }
      .num-btn { padding: 18px 0; font-size: 21px; }
      .tool-btn { padding: 10px 14px; font-size: 12px; }
    }
    /* 데스크탑에서 num-pad 가운데 정렬 */
    @media (min-width: 640px) {
      .num-pad { margin-left: auto; margin-right: auto; }
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--fg); color: white;
      padding: 12px 22px; font-size: 13px; font-weight: 600;
      z-index: 9999; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; letter-spacing: 0.02em;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    #toast.show { opacity: 1; }

    /* Dot Pad popup */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; justify-content: center; align-items: center;
      z-index: 200; backdrop-filter: blur(4px);
      padding: 20px;
    }
    .overlay.active { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--line);
      padding: 24px; width: 90%; max-width: 320px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    }
    .modal h3 { margin: 0 0 6px; font-size: 16px; color: var(--fg); letter-spacing: -0.01em; font-weight: 800; }
    .modal p { font-size: 12px; color: var(--fg-dim); margin: 0 0 16px; line-height: 1.5; }
    .modal .row { display: flex; gap: 8px; }

    /* Dot Pad preview — full 30x10 grid */
    .dotpad-preview {
      background: var(--bg-card); border: 1px solid var(--line);
      padding: 14px; margin-top: 16px;
      border-radius: 18px;
    }
    @media (min-width: 1024px) {
      .dotpad-preview { padding: 20px; border-radius: 22px; }
    }
    .dotpad-preview-label {
      font-size: 9px; color: var(--fg-dim); letter-spacing: 0.14em;
      font-weight: 700; margin-bottom: 8px;
    }
    .dotpad-preview-grid {
      display: grid; grid-template-columns: repeat(30, 1fr);
      gap: 1px;
      background: var(--bg-soft);
      border-radius: 6px; overflow: hidden;
      padding: 3px;
    }
    .dotpad-preview-grid.full {
      grid-template-rows: repeat(10, 1fr);
      aspect-ratio: 30 / 13; /* 30 wide × 10 tall (2x4 dots/cell, but slightly stretched vertically) */
    }
    .dp-c {
      position: relative; background: rgba(0,0,0,0.02);
      border-radius: 1px;
    }
    .dp-d {
      position: absolute; width: 30%; height: 18%;
      background: var(--fg-faint); border-radius: 50%;
    }
    .dp-d.up { background: var(--dot); box-shadow: 0 0 1px rgba(0,0,0,0.3); }
    .dp-d.d1 { left: 18%; top: 6%; }
    .dp-d.d2 { left: 18%; top: 30%; }
    .dp-d.d3 { left: 18%; top: 54%; }
    .dp-d.d7 { left: 18%; top: 78%; }
    .dp-d.d4 { left: 58%; top: 6%; }
    .dp-d.d5 { left: 58%; top: 30%; }
    .dp-d.d6 { left: 58%; top: 54%; }
    .dp-d.d8 { left: 58%; top: 78%; }
    /* Text line below (20 cells) */
    .dotpad-text-line {
      display: flex; align-items: center; gap: 8px;
      margin-top: 8px; padding: 8px 10px;
      background: var(--bg-soft); border-radius: 8px;
      font-size: 10px; color: var(--fg-soft);
    }
    .tl-label {
      background: var(--fg); color: white;
      padding: 2px 7px; border-radius: 999px;
      font-size: 8px; letter-spacing: 0.12em; font-weight: 700;
    }
    .tl-content { font-family: 'SF Mono', Menlo, monospace; letter-spacing: 0.05em; }

    /* Key hints */
    .key-hints {
      background: var(--bg-card); padding: 12px 16px;
      font-size: 13px; color: var(--fg-soft);
      letter-spacing: 0; line-height: 1.6;
      margin-bottom: 14px; border: 1px solid var(--line);
      border-radius: 14px;
    }
    .key-hints b { color: var(--fg); font-weight: 700; }

    /* Footer brand mark (small dot cluster) */
    .footer-mark {
      display: flex; justify-content: center; align-items: center;
      gap: 4px; margin-top: 18px; opacity: 0.4;
    }
    .footer-mark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
  </style>
</head>

  function cycleDifficulty(game) {
    const cur = state.difficulty[game];
    const idx = DIFF_LEVELS.indexOf(cur);
    state.difficulty[game] = DIFF_LEVELS[(idx + 1) % DIFF_LEVELS.length];
    // Reset puzzle state so next start uses new size
    state[game] = null;
    renderLauncher();
  }
  window.cycleDifficulty = cycleDifficulty;

  // ============================================================
  // UTILITIES
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs={}, ...children) {
    const e = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k.startsWith('on')) e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    children.forEach(c => {
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
    return e;
  }
  function toast(msg, ms=1500) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), ms);
  }
  function speak(text) {
    if (!state.ttsOn || !window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }

  // ============================================================
  // HEADER
  // ============================================================
  function renderHeader(titleHtml, subText, eyebrowText) {
    const stageNum = { launcher: '', sudoku: '1', minesweeper: '2', nonogram: '3', maze: '4' }[state.screen] || '';
    const stageLabel = { sudoku: 'Sudoku', minesweeper: 'Minesweeper', nonogram: 'Nonogram', maze: 'Maze' }[state.screen] || '';
    return `
      <header class="topbar" role="banner">
        ${state.screen !== 'launcher' ? `<button class="back-btn" onclick="goLauncher()" aria-label="Back to main menu" type="button">←</button>` : `<div class="brand">DOT <b>ARCADE</b></div>`}
        <div class="game-eyebrow" style="${state.screen==='launcher'?'display:none':''}">${stageLabel} ${stageNum}</div>
        <div class="header-btns">
          <button class="icon-btn ${state.ttsOn?'active':''}" id="tts-btn" onclick="toggleTts()" type="button" aria-pressed="${state.ttsOn}" aria-label="Toggle voice announcements">Voice</button>
          <button class="icon-btn ${state.dotpadConnected?'connected':''}" id="dp-btn" onclick="openDpOverlay()" type="button" aria-label="${state.dotpadConnected?'Dot Pad connected. Click to manage':'Connect Dot Pad'}">${state.dotpadConnected?'● PAD':'PAD'}</button>
        </div>
      </header>
      ${titleHtml ? `
        <div class="game-head">
          ${eyebrowText ? `<div class="game-eyebrow">${eyebrowText}</div>` : ''}
          <div class="game-title">${titleHtml}</div>
          ${subText ? `<div class="game-sub">${subText}</div>` : ''}
        </div>` : ''}
    `;
  }

  function toggleTts() {
    state.ttsOn = !state.ttsOn;
    if (!state.ttsOn) window.speechSynthesis.cancel();
    render();
  }

  function goLauncher() {
    state.screen = 'launcher';
    state.dotpadCursor = 0;
    render();
  }

  // ============================================================
  // ROUTER
  // ============================================================
  function render() {
    document.getElementById('app').setAttribute('data-theme', state.screen);
    document.body.setAttribute('data-theme', state.screen);
    if (state.screen === 'launcher') renderLauncher();
    else if (state.screen === 'sudoku') renderSudoku();
    else if (state.screen === 'minesweeper') renderMinesweeper();
    else if (state.screen === 'nonogram') renderNonogram();
    else if (state.screen === 'maze') renderMaze();
    setTimeout(() => {
      if (state.dotpadConnected) dotpadHighlight();
      pushToDotpad();
    }, 50);
  }

  // LAUNCHER
  // ============================================================

    return `${n} × ${n} · Fill rows, columns, and ${box.rows}×${box.cols} boxes with 1-${n}.`;
  }
  function getMsSub() {
    const cfg = MS_CFG[state.difficulty.minesweeper];
    return `${cfg.N} × ${cfg.N} · ${cfg.mines} mines. Reveal safe cells, flag the mines.`;
  }
  function getNonoSub() {
    const n = NONO_BY_DIFF[state.difficulty.nonogram].length;
    return `${n} × ${n} · Use row and column hints to reveal the picture.`;
  }
  function getMazeSub() {
    const n = MAZE_BY_DIFF[state.difficulty.maze];
    return `${n} × ${n} · Navigate from start to goal. Pan keys steer.`;
  }
