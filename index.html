<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DotPuzzle Pack — Daily Tactile Puzzles</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      /* Heap-inspired light palette */
      --bg-app: #fafafa;
      --bg-card: #ffffff;
      --bg-soft: #f3f3f1;
      --line: #e8e8e6;
      --line-soft: #f0f0ee;
      --fg: #0a0a0a;
      --fg-soft: #4a4a4a;
      --fg-dim: #8a8a8a;
      --fg-faint: #c5c5c3;
      --dot: #0a0a0a;
      /* Game accents */
      --c-sudoku: #7fb2e8;
      --c-sudoku-soft: #d4e7f9;
      --c-mine: #f5b5bd;
      --c-mine-soft: #fde0e3;
      --c-nono: #f5c957;
      --c-nono-soft: #fdf0c8;
      --c-maze: #67b87b;
      --c-maze-soft: #d4ecd9;
      --accent: var(--c-sudoku);
      /* status */
      --ok: #3a8d4f;
      --danger: #d04848;
      --info: #4a8fcf;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #eaeaea;
      color: var(--fg);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 24px 12px;
      -webkit-font-smoothing: antialiased;
    }
    /* iPhone 15 frame — titanium bezel + Dynamic Island + side buttons */
    .iphone-shell {
      position: relative;
      filter: drop-shadow(0 24px 48px rgba(0,0,0,0.25));
    }
    .iphone {
      width: 388px; max-width: 100%;
      height: 820px; max-height: 95vh;
      background: var(--bg-app);
      border-radius: 56px;
      padding: 11px;
      background: linear-gradient(135deg, #2a2c30 0%, #1a1c20 30%, #0d0e10 50%, #1a1c20 70%, #2a2c30 100%);
      position: relative;
      box-shadow:
        inset 0 0 0 1.5px rgba(255,255,255,0.08),
        inset 0 0 0 3px rgba(0,0,0,0.4);
      transform: translateZ(0);
    }
    .iphone-inner {
      width: 100%; height: 100%;
      background: var(--bg-app);
      border-radius: 45px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4);
    }
    /* Dynamic Island */
    .dynamic-island {
      position: absolute; top: 21px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 34px;
      background: #050505;
      border-radius: 999px;
      z-index: 100;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.05);
    }
    .dynamic-island::after {
      content: ''; position: absolute;
      right: 10px; top: 50%; transform: translateY(-50%);
      width: 8px; height: 8px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a4a8e, #0a0e1a);
      box-shadow: inset 0 0 2px rgba(80,140,200,0.6);
    }
    /* Side buttons */
    .iphone-side {
      position: absolute; background: #1a1c20;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -1px 1px rgba(0,0,0,0.3);
    }
    .side-action { left: -2px; top: 122px; width: 4px; height: 32px; border-radius: 1.5px 0 0 1.5px; }
    .side-volup { left: -2px; top: 178px; width: 4px; height: 52px; border-radius: 1.5px 0 0 1.5px; }
    .side-voldn { left: -2px; top: 244px; width: 4px; height: 52px; border-radius: 1.5px 0 0 1.5px; }
    .side-power { right: -2px; top: 192px; width: 4px; height: 78px; border-radius: 0 1.5px 1.5px 0; }
    .app {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 70px 20px 22px;
      overflow-y: auto; overflow-x: hidden;
      background: var(--bg-app);
    }
    /* Themed game screens — different accent per game */
    .app[data-theme="sudoku"] { --accent: var(--c-sudoku); --accent-soft: var(--c-sudoku-soft); }
    .app[data-theme="minesweeper"] { --accent: var(--c-mine); --accent-soft: var(--c-mine-soft); }
    .app[data-theme="nonogram"] { --accent: var(--c-nono); --accent-soft: var(--c-nono-soft); }
    .app[data-theme="maze"] { --accent: var(--c-maze); --accent-soft: var(--c-maze-soft); }

    /* Top bar */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; gap: 8px;
    }
    .brand {
      font-size: 11px; letter-spacing: 0.18em; color: var(--fg-dim);
      font-weight: 700;
    }
    .brand b { color: var(--fg); }
    .header-btns { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg-soft); font-size: 10px; padding: 6px 11px;
      cursor: pointer; font-family: inherit; letter-spacing: 0.08em;
      border-radius: 999px; font-weight: 600;
      transition: all 0.15s;
    }
    .icon-btn:hover { border-color: var(--fg-faint); color: var(--fg); }
    .icon-btn.active { background: var(--fg); color: white; border-color: var(--fg); }
    .icon-btn.connected { background: var(--ok); color: white; border-color: var(--ok); }
    .back-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg); font-size: 14px; padding: 6px 10px;
      cursor: pointer; font-family: inherit;
      border-radius: 999px; line-height: 1;
    }
    .back-btn:hover { background: var(--bg-soft); }

    /* Launcher */
    .launcher-hero {
      background: var(--c-sudoku-soft);
      border-radius: 28px;
      padding: 24px 22px;
      margin-bottom: 18px;
      position: relative; overflow: hidden;
    }
    .launcher-hero-dots {
      position: absolute; right: -30px; bottom: -30px;
      width: 180px; height: 90px;
    }
    .launcher-hero-dots svg { width: 100%; height: 100%; }
    .launcher-eyebrow {
      font-size: 10px; letter-spacing: 0.18em; color: var(--fg-soft);
      font-weight: 700; margin-bottom: 8px;
    }
    .launcher-title {
      font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
      line-height: 1.15; color: var(--fg);
      margin: 0 0 8px;
    }
    .launcher-sub {
      font-size: 13px; color: var(--fg-soft); line-height: 1.5;
      max-width: 75%;
    }
    .launcher-section-label {
      font-size: 10px; letter-spacing: 0.18em; color: var(--fg-dim);
      font-weight: 700; margin: 10px 4px 10px;
    }

    /* Game card — Heap-style with colored swatch + check */
    .game-card {
      width: 100%;
      background: var(--bg-card); border: 1px solid var(--line);
      padding: 16px; margin-bottom: 10px;
      cursor: pointer; transition: all 0.15s;
      text-align: left;
      border-radius: 20px;
      display: flex; gap: 14px; align-items: center;
      font-family: inherit;
    }
    .game-card:hover { border-color: var(--fg-faint); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.04); }
    .game-card.dotpad-focus { border-color: var(--dot); box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
    .game-card-swatch {
      width: 56px; height: 56px; flex-shrink: 0;
      border-radius: 16px;
      display: flex; justify-content: center; align-items: center;
      padding: 8px;
    }
    .game-card-swatch svg { width: 100%; height: 100%; display: block; }
    .swatch-sudoku { background: var(--c-sudoku-soft); }
    .swatch-mine { background: var(--c-mine-soft); }
    .swatch-nono { background: var(--c-nono-soft); }
    .swatch-maze { background: var(--c-maze-soft); }
    .swatch-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--dot); position: relative; }
    .swatch-dot::before, .swatch-dot::after {
      content: ''; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--dot);
    }
    .swatch-dot.cluster::before { left: -14px; top: 6px; }
    .swatch-dot.cluster::after { right: -14px; top: 6px; }
    .game-card-body { flex: 1; min-width: 0; }
    .game-card-title {
      font-size: 15px; font-weight: 700; color: var(--fg);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .game-card-sub {
      font-size: 12px; color: var(--fg-dim); line-height: 1.45;
    }
    .game-card-arrow {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg-soft); color: var(--fg);
      display: flex; justify-content: center; align-items: center;
      font-size: 14px; flex-shrink: 0;
    }
    /* Difficulty chip */
    .diff-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--bg-soft); border: 1px solid var(--line);
      color: var(--fg); font-size: 10px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      cursor: pointer; font-family: inherit; letter-spacing: 0.06em;
      margin-top: 6px; transition: all 0.15s;
    }
    .diff-chip:hover { background: var(--bg-card); border-color: var(--fg-faint); }
    .diff-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
    .diff-chip[data-level="easy"] .dot { background: #67b87b; }
    .diff-chip[data-level="medium"] .dot { background: #f5c957; }
    .diff-chip[data-level="hard"] .dot { background: #d04848; }
    /* Helper tools bar (per-game) */
    .tools-bar {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .tool-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg); font-size: 11px; font-weight: 600;
      padding: 7px 12px; border-radius: 999px;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: var(--bg-soft); border-color: var(--fg-faint); }
    .tool-btn .ico { display: inline-block; margin-right: 4px; }

    /* Game header */
    .game-head {
      background: var(--accent-soft);
      border-radius: 22px;
      padding: 14px 16px 12px;
      margin-bottom: 14px;
      position: relative; overflow: hidden;
    }
    .game-head-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .game-eyebrow {
      font-size: 10px; letter-spacing: 0.15em; color: var(--fg-soft);
      font-weight: 700;
    }
    .game-title {
      font-size: 19px; font-weight: 800; color: var(--fg);
      letter-spacing: -0.01em; line-height: 1.2;
    }
    .game-sub {
      font-size: 12px; color: var(--fg-soft);
      line-height: 1.45;
    }

    /* Sudoku */
    .sudoku-grid {
      display: grid; grid-template-columns: repeat(9, 1fr);
      gap: 1px; background: var(--fg-faint);
      border: 2px solid var(--fg);
      margin-bottom: 14px;
      aspect-ratio: 1;
      border-radius: 8px; overflow: hidden;
    }
    .sudoku-cell {
      background: var(--bg-card);
      display: flex; justify-content: center; align-items: center;
      font-size: 14px; font-weight: 700; color: var(--fg);
      cursor: pointer; user-select: none;
      position: relative;
    }
    .sudoku-cell.given { color: var(--fg); background: var(--bg-soft); }
    .sudoku-cell.user { color: var(--info); }
    .sudoku-cell.bad { color: var(--danger); }
    .sudoku-cell.focused { background: var(--accent); color: var(--fg); z-index: 2; }
    /* Box dividers — class-driven for variable sizes */
    .sudoku-cell.box-r { border-right: 2px solid var(--fg); }
    .sudoku-cell.box-b { border-bottom: 2px solid var(--fg); }

    /* iOS-style number pad */
    .num-pad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 12px;
      max-width: 280px;
    }
    .num-btn {
      background: var(--bg-card); border: 1px solid var(--line);
      color: var(--fg); padding: 14px 0;
      font-size: 19px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      border-radius: 16px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 1px; transition: all 0.1s;
    }
    .num-btn:hover { background: var(--bg-soft); border-color: var(--fg-faint); }
    .num-btn:active { transform: scale(0.97); background: var(--accent-soft); }
    .num-btn .sub {
      font-size: 8px; letter-spacing: 0.15em; color: var(--fg-dim);
      font-weight: 600;
    }
    .num-btn.dotpad-focus { background: var(--accent); border-color: var(--dot); }
    .num-btn.erase { background: var(--bg-soft); }
    .num-row { display: flex; gap: 8px; }
    .num-row > * { flex: 1; }

    /* Cancel/Done pill bar */
    .pad-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0 12px;
      font-size: 14px; font-weight: 600;
    }
    .pad-bar .cancel { color: var(--info); cursor: pointer; }
    .pad-bar .done { color: var(--info); cursor: pointer; }

    /* Minesweeper */
    .ms-grid {
      display: grid; gap: 1px; background: var(--fg-faint);
      border: 2px solid var(--fg);
      margin-bottom: 12px;
      aspect-ratio: 1;
      border-radius: 8px; overflow: hidden;
    }
    .ms-cell {
      background: var(--bg-soft);
      display: flex; justify-content: center; align-items: center;
      font-size: 11px; font-weight: 700; color: var(--fg);
      cursor: pointer; user-select: none;
    }
    .ms-cell.revealed { background: var(--bg-card); color: var(--fg-soft); }
    .ms-cell.revealed.n1 { color: var(--info); }
    .ms-cell.revealed.n2 { color: var(--ok); }
    .ms-cell.revealed.n3 { color: var(--danger); }
    .ms-cell.revealed.n4 { color: #8a4fb5; }
    .ms-cell.flagged { background: var(--c-mine-soft); }
    .ms-cell.flagged::after { content: '⚑'; color: var(--danger); font-size: 12px; }
    .ms-cell.mine { background: var(--c-mine); }
    .ms-cell.mine::after { content: '●'; color: var(--dot); }
    .ms-cell.focused { background: var(--accent); color: var(--fg); z-index: 2; }
    .ms-status {
      display: flex; justify-content: space-around;
      font-size: 11px; color: var(--fg-soft); margin-bottom: 8px;
      background: var(--bg-card); border: 1px solid var(--line);
      border-radius: 14px; padding: 8px 10px;
    }
    .ms-status b { color: var(--fg); font-weight: 700; }

    /* Nonogram */
    .nono-wrap {
      display: grid; gap: 1px;
      margin-bottom: 12px;
    }
    .nono-hint-cell {
      background: var(--bg-soft); padding: 2px 4px;
      font-size: 9px; color: var(--fg-soft);
      display: flex; align-items: center; line-height: 1.1;
      letter-spacing: 0; font-weight: 600;
    }
    .nono-hint-cell.col { flex-direction: column; justify-content: flex-end; text-align: center; }
    .nono-hint-cell.row { justify-content: flex-end; }
    .nono-grid-area {
      background: var(--fg-faint); border: 2px solid var(--fg);
      border-radius: 4px; overflow: hidden;
    }
    .nono-cell {
      background: var(--bg-card); cursor: pointer; user-select: none;
      display: flex; justify-content: center; align-items: center;
      font-size: 10px; color: var(--fg-dim);
    }
    .nono-cell.filled { background: var(--dot); }
    .nono-cell.x::after { content: '×'; color: var(--fg-dim); font-size: 12px; }
    .nono-cell.focused { box-shadow: inset 0 0 0 2px var(--c-nono); z-index: 2; }

    /* Maze */
    .maze-grid {
      display: grid; gap: 0;
      margin-bottom: 12px;
      aspect-ratio: 1;
      border: 2px solid var(--fg);
      border-radius: 8px; overflow: hidden;
      background: var(--bg-card);
    }
    .maze-cell {
      background: var(--bg-card); position: relative;
    }
    .maze-cell.wall { background: var(--fg); }
    .maze-cell.player::after {
      content: ''; position: absolute; inset: 12%;
      background: var(--c-maze); border-radius: 50%;
      box-shadow: 0 0 0 2px var(--fg);
    }
    .maze-cell.goal::after {
      content: ''; position: absolute; inset: 25%;
      background: var(--accent); border-radius: 50%;
    }
    .maze-controls {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; margin: 0 auto; width: 200px;
    }
    .maze-controls .num-btn { padding: 14px 0; font-size: 16px; }
    .maze-controls .empty { background: transparent; border: none; }

    /* Action buttons */
    .action-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 12px;
    }
    .primary-btn {
      background: var(--fg); color: white; border: none;
      padding: 14px 22px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; letter-spacing: 0.02em;
      flex: 1; min-width: 130px;
      border-radius: 999px;
      transition: all 0.15s;
    }
    .primary-btn:hover { background: #2a2a2a; transform: translateY(-1px); }
    .primary-btn.dotpad-focus { box-shadow: 0 0 0 3px var(--accent); }
    .ghost-btn {
      background: var(--bg-card); color: var(--fg);
      border: 1px solid var(--line);
      padding: 14px 22px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      border-radius: 999px;
      transition: all 0.15s;
    }
    .ghost-btn:hover { background: var(--bg-soft); border-color: var(--fg-faint); }
    .ghost-btn.dotpad-focus { border-color: var(--dot); }

    /* Toast */
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--fg); color: white;
      padding: 12px 22px; font-size: 13px; font-weight: 600;
      z-index: 9999; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; letter-spacing: 0.02em;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    #toast.show { opacity: 1; }

    /* Dot Pad popup */
    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.4);
      display: none; justify-content: center; align-items: center;
      z-index: 200; backdrop-filter: blur(4px);
    }
    .overlay.active { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--line);
      padding: 24px; width: 90%; max-width: 320px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    }
    .modal h3 { margin: 0 0 6px; font-size: 16px; color: var(--fg); letter-spacing: -0.01em; font-weight: 800; }
    .modal p { font-size: 12px; color: var(--fg-dim); margin: 0 0 16px; line-height: 1.5; }
    .modal .row { display: flex; gap: 8px; }

    /* Dot Pad preview strip */
    .dotpad-preview {
      background: var(--bg-card); border: 1px solid var(--line);
      padding: 12px; margin-top: 12px;
      border-radius: 16px;
    }
    .dotpad-preview-label {
      font-size: 9px; color: var(--fg-dim); letter-spacing: 0.18em;
      font-weight: 700; margin-bottom: 8px;
    }
    .dotpad-preview-grid {
      display: grid; grid-template-columns: repeat(30, 1fr);
      gap: 0; aspect-ratio: 3 / 1;
      background: var(--bg-soft);
      border-radius: 6px; overflow: hidden;
    }
    .dp-cell { background: transparent; position: relative; }
    .dp-cell .dot {
      position: absolute; width: 30%; height: 20%;
      background: var(--fg-faint); border-radius: 50%;
    }
    .dp-cell .dot.up { background: var(--dot); }
    .dp-cell .dot.d1 { left: 20%; top: 12%; }
    .dp-cell .dot.d2 { left: 20%; top: 44%; }
    .dp-cell .dot.d3 { left: 20%; top: 72%; }
    .dp-cell .dot.d4 { left: 60%; top: 12%; }
    .dp-cell .dot.d5 { left: 60%; top: 44%; }
    .dp-cell .dot.d6 { left: 60%; top: 72%; }

    /* Key hints */
    .key-hints {
      background: var(--bg-card); padding: 10px 14px;
      font-size: 11px; color: var(--fg-soft);
      letter-spacing: 0; line-height: 1.55;
      margin-bottom: 12px; border: 1px solid var(--line);
      border-radius: 14px;
    }
    .key-hints b { color: var(--fg); font-weight: 700; }

    /* Footer brand mark (small dot cluster) */
    .footer-mark {
      display: flex; justify-content: center; align-items: center;
      gap: 4px; margin-top: 18px; opacity: 0.4;
    }
    .footer-mark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
  </style>
</head>
<body>
  <div class="iphone-shell">
  <div class="iphone">
    <div class="iphone-side side-action"></div>
    <div class="iphone-side side-volup"></div>
    <div class="iphone-side side-voldn"></div>
    <div class="iphone-side side-power"></div>
    <div class="iphone-inner">
    <div class="dynamic-island"></div>
    <div class="app" id="app">
      <div id="screen"></div>
    </div>

    <div class="overlay" id="dp-overlay">
      <div class="modal">
        <h3>🔌 CONNECT DOT PAD</h3>
        <p>Chrome / Edge desktop · HTTPS only. Pair the device near your laptop.</p>
        <div class="row">
          <button class="primary-btn" onclick="connectBle()">📶 Bluetooth</button>
          <button class="primary-btn" onclick="connectUsb()">🔗 USB</button>
        </div>
        <p style="margin-top:14px;margin-bottom:0;text-align:right">
          <button class="ghost-btn" onclick="closeDpOverlay()">Cancel</button>
        </p>
      </div>
    </div>
    </div>
  </div>
  </div>

  <div id="toast"></div>

  <!-- Dot Pad SDK (Web SDK 3.0.0) -->

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs={}, ...children) {
    const e = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k.startsWith('on')) e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    children.forEach(c => {
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
    return e;
  }
  function toast(msg, ms=1500) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), ms);
  }
  function speak(text) {
    if (!state.ttsOn || !window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }

  function startGame(name) {
    state.screen = name;
    state.dotpadCursor = 0;
    if (name === 'sudoku') initSudoku();
    if (name === 'minesweeper') initMinesweeper();
    if (name === 'nonogram') initNonogram();
    if (name === 'maze') initMaze();
    render();
    speak(name + '. ' + (name === 'sudoku' ? 'Fill the grid with one to nine.' :
      name === 'minesweeper' ? 'Find the mines without revealing them.' :
      name === 'nonogram' ? 'Use the hints to reveal the picture.' :
      'Navigate the maze to the goal.'));
  }

  // ============================================================
  // SUDOKU
  // ============================================================
  function initSudoku() {
    if (state.sudoku) return;
    const cfg = SUDOKU_BY_DIFF[state.difficulty.sudoku];
    state.sudoku = {
      N: cfg.max,
      box: cfg.box,
      solution: cfg.solution.map(r => r.slice()),
      grid: cfg.puzzle.map(r => r.slice()),
      given: cfg.puzzle.map(r => r.map(v => v !== 0)),
      cursor: { r: 0, c: 0 },
      mode: 'cell',
      numCursor: 0,
    };
  }

  function renderSudoku() {
    const s = state.sudoku;
    let cellsHtml = '';
    for (let r = 0; r < s.N; r++) {
      for (let c = 0; c < s.N; c++) {
        const v = s.grid[r][c];
        // Box dividers — last col of box gets right border, last row of box gets bottom
        const isBoxRight = (c + 1) % s.box.cols === 0 && c < s.N - 1;
        const isBoxBottom = (r + 1) % s.box.rows === 0 && r < s.N - 1;
        const cls = [
          'sudoku-cell',
          s.given[r][c] ? 'given' : (v ? 'user' : ''),
          (r === s.cursor.r && c === s.cursor.c && s.mode === 'cell') ? 'focused' : '',
          isBoxRight ? 'box-r' : '',
          isBoxBottom ? 'box-b' : '',
        ].filter(Boolean).join(' ');
        cellsHtml += `<div class="${cls}" data-r="${r}" data-c="${c}" onclick="sudokuClick(${r},${c})">${v||''}</div>`;
      }
    }
    const subs = ['', '', 'ABC', 'DEF', 'GHI', 'JKL', 'MNO', 'PQRS', 'TUV', 'WXYZ'];
    let numHtml = '';
    for (let n = 1; n <= s.N; n++) {
      const focused = s.mode === 'num-pad' && s.numCursor === n - 1 ? 'dotpad-focus' : '';
      numHtml += `<button class="num-btn ${focused}" onclick="sudokuInput(${n})">${n}<span class="sub">${subs[n]||'&nbsp;'}</span></button>`;
    }
    const eraseFocused = s.mode==='num-pad'&&s.numCursor===s.N?'dotpad-focus':'';

    // Pad layout: for 4x4 = 2 rows of 2, for 6x6 = 2 rows of 3, for 9x9 = 3 rows of 3
    const padCols = s.N === 4 ? 2 : 3;
    $('screen').innerHTML = `
      ${renderHeader('Fill the grid', `${s.N} × ${s.N} · Row ${s.cursor.r+1} · Col ${s.cursor.c+1}`, `Stage 1 · Sudoku · ${DIFF_LABEL[state.difficulty.sudoku]}`)}
      <div class="tools-bar">
        <button class="tool-btn" onclick="sudokuReadRow()"><span class="ico">📢</span>Read row</button>
        <button class="tool-btn" onclick="sudokuWhatMissing()"><span class="ico">?</span>What's missing</button>
        <button class="tool-btn" onclick="sudokuCheck()"><span class="ico">✓</span>Check</button>
        <button class="tool-btn" onclick="announceContextHelp()"><span class="ico">?</span>Help</button>
      </div>
      <div class="sudoku-grid" id="sudoku-grid" style="grid-template-columns: repeat(${s.N}, 1fr)">${cellsHtml}</div>
      <div class="pad-bar">
        <span class="cancel" onclick="goLauncher()">Back</span>
        <span class="done" onclick="sudokuCheck()">Check</span>
      </div>
      <div class="num-pad" style="grid-template-columns: repeat(${padCols}, 1fr)">
        ${numHtml}
        <button class="num-btn erase ${eraseFocused}" onclick="sudokuInput(0)">⌫</button>
      </div>
      <div class="action-bar">
        <button class="ghost-btn" onclick="sudokuReset()">Reset</button>
      </div>
      ${renderDotpadPreview()}
    `;
  }

  // Sudoku helper: read current row
  function sudokuReadRow() {
    const s = state.sudoku;
    const row = s.grid[s.cursor.r];
    const cells = row.map((v, i) => v ? v.toString() : 'empty').join(', ');
    const msg = `Row ${s.cursor.r+1}: ${cells}.`;
    toast(msg, 4000); speak(msg);
  }
  // Sudoku helper: what's missing in current row
  function sudokuWhatMissing() {
    const s = state.sudoku;
    const row = s.grid[s.cursor.r];
    const has = new Set(row.filter(v => v));
    const missing = [];
    for (let n = 1; n <= s.N; n++) if (!has.has(n)) missing.push(n);
    const msg = missing.length === 0
      ? `Row ${s.cursor.r+1} complete.`
      : `Row ${s.cursor.r+1} needs: ${missing.join(', ')}.`;
    toast(msg, 4000); speak(msg);
  }
  window.sudokuReadRow = sudokuReadRow;
  window.sudokuWhatMissing = sudokuWhatMissing;

  function sudokuClick(r, c) {
    const s = state.sudoku;
    if (s.given[r][c]) { toast('Given digit'); return; }
    s.cursor.r = r; s.cursor.c = c; s.mode = 'cell';
    render();
    speak(`Row ${r+1} column ${c+1}. ${s.grid[r][c] || 'empty'}.`);
  }
  function sudokuInput(n) {
    const s = state.sudoku;
    const { r, c } = s.cursor;
    if (s.given[r][c]) { toast('Given digit'); return; }
    s.grid[r][c] = n;
    render();
    speak(n === 0 ? 'Erased' : ('Set to ' + n));
  }
  function sudokuCheck() {
    const s = state.sudoku;
    let wrong = 0, empty = 0;
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      if (s.grid[r][c] === 0) empty++;
      else if (s.grid[r][c] !== s.solution[r][c]) wrong++;
    }
    if (empty === 0 && wrong === 0) {
      toast('☆ Solved!', 3000);
      speak('Solved.');
    } else if (wrong === 0) {
      toast(empty + ' cells to go');
      speak(empty + ' cells remaining.');
    } else {
      toast(wrong + ' wrong · ' + empty + ' empty');
      speak(wrong + ' wrong, ' + empty + ' empty.');
    }
  }
  function sudokuReset() {
    state.sudoku = null;
    initSudoku();
    render();
  }

  // ============================================================
  // MINESWEEPER
  // ============================================================
  function initMinesweeper() {
    const cfg = MS_CFG[state.difficulty.minesweeper];
    const N = cfg.N, MINES = cfg.mines;
    const grid = Array.from({length: N}, () => Array(N).fill(0));
    const revealed = Array.from({length: N}, () => Array(N).fill(false));
    const flagged = Array.from({length: N}, () => Array(N).fill(false));
    state.minesweeper = {
      N, MINES,
      grid, revealed, flagged,
      cursor: { r: 0, c: 0 },
      gameOver: false, won: false,
      firstClick: true, // 첫 클릭 안전 보장
    };
  }

  // 첫 클릭 위치 안전하게: 그 셀과 주변 8칸 제외하고 mine 배치
  function msPlaceMines(safeR, safeC) {
    const s = state.minesweeper;
    const safe = new Set();
    for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
      safe.add((safeR+dr) + ',' + (safeC+dc));
    }
    let placed = 0;
    while (placed < s.MINES) {
      const r = Math.floor(Math.random() * s.N);
      const c = Math.floor(Math.random() * s.N);
      if (s.grid[r][c] !== -1 && !safe.has(r + ',' + c)) {
        s.grid[r][c] = -1; placed++;
      }
    }
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      if (s.grid[r][c] === -1) continue;
      let cnt = 0;
      for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
        const nr = r+dr, nc = c+dc;
        if (nr<0||nr>=s.N||nc<0||nc>=s.N) continue;
        if (s.grid[nr][nc] === -1) cnt++;
      }
      s.grid[r][c] = cnt;
    }
  }

  // Safe hint — 안전한 셀 한 개 음성으로 안내
  function msSafeHint() {
    const s = state.minesweeper;
    if (s.firstClick) { toast('Tap any cell to start'); speak('Tap any cell to start.'); return; }
    // 가려져 있고 지뢰가 아닌 셀 중 하나 선택
    const safeHidden = [];
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      if (!s.revealed[r][c] && !s.flagged[r][c] && s.grid[r][c] !== -1) {
        safeHidden.push({r, c});
      }
    }
    if (safeHidden.length === 0) { toast('No safe hidden cells left'); return; }
    const pick = safeHidden[Math.floor(Math.random() * safeHidden.length)];
    s.cursor.r = pick.r; s.cursor.c = pick.c;
    const msg = `Safe cell: row ${pick.r+1} column ${pick.c+1}.`;
    toast(msg, 3000); speak(msg);
    render();
  }
  window.msSafeHint = msSafeHint;

  function renderMinesweeper() {
    const s = state.minesweeper;
    let cellsHtml = '';
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      const focused = (r === s.cursor.r && c === s.cursor.c) ? 'focused' : '';
      let cls = `ms-cell ${focused}`;
      let label = '';
      if (s.revealed[r][c]) {
        if (s.grid[r][c] === -1) { cls += ' mine'; }
        else {
          cls += ' revealed n' + s.grid[r][c];
          if (s.grid[r][c] > 0) label = s.grid[r][c];
        }
      } else if (s.flagged[r][c]) {
        cls += ' flagged';
      }
      cellsHtml += `<div class="${cls}" onclick="msClick(${r},${c})" oncontextmenu="event.preventDefault();msFlag(${r},${c});return false">${label}</div>`;
    }
    const flagsLeft = s.MINES - s.flagged.flat().filter(Boolean).length;

    $('screen').innerHTML = `
      ${renderHeader('Find the mines', `${s.N} × ${s.N} · ${s.MINES} mines · Row ${s.cursor.r+1}, Col ${s.cursor.c+1}`, `Stage 2 · Minesweeper · ${DIFF_LABEL[state.difficulty.minesweeper]}`)}
      <div class="ms-status">
        <span>Mines: <b>${s.MINES}</b></span>
        <span>Flags left: <b>${flagsLeft}</b></span>
        <span>${s.gameOver ? (s.won ? '☆ Won' : '☠ Lost') : (s.firstClick ? 'Tap to start' : 'Playing')}</span>
      </div>
      <div class="tools-bar">
        <button class="tool-btn" onclick="msSafeHint()"><span class="ico">💡</span>Safe hint</button>
        <button class="tool-btn" onclick="msReadAround()"><span class="ico">📢</span>Read around</button>
        <button class="tool-btn" onclick="state.minesweeper=null;initMinesweeper();render()"><span class="ico">↺</span>New game</button>
        <button class="tool-btn" onclick="announceContextHelp()"><span class="ico">?</span>Help</button>
      </div>
      <div class="ms-grid" id="ms-grid" style="grid-template-columns: repeat(${s.N}, 1fr)">${cellsHtml}</div>
      <div class="key-hints"><b>Tap</b> reveal · <b>right-click</b> flag · Dot Pad: <b>F3</b> reveal · <b>F4</b> flag</div>
      ${renderDotpadPreview()}
    `;
  }

  // Minesweeper: read 8 cells around cursor
  function msReadAround() {
    const s = state.minesweeper;
    const dirs = [
      ['north-west', -1, -1], ['north', -1, 0], ['north-east', -1, 1],
      ['west', 0, -1], ['east', 0, 1],
      ['south-west', 1, -1], ['south', 1, 0], ['south-east', 1, 1],
    ];
    const around = dirs.map(([name, dr, dc]) => {
      const nr = s.cursor.r + dr, nc = s.cursor.c + dc;
      if (nr<0||nr>=s.N||nc<0||nc>=s.N) return null;
      let st;
      if (s.revealed[nr][nc]) {
        const v = s.grid[nr][nc];
        st = v === -1 ? 'mine' : v === 0 ? 'empty' : v + ' nearby';
      } else st = s.flagged[nr][nc] ? 'flagged' : 'hidden';
      return name + ' ' + st;
    }).filter(Boolean);
    const msg = around.join('. ');
    toast(msg, 5000); speak(msg);
  }
  window.msReadAround = msReadAround;

  function msClick(r, c) {
    const s = state.minesweeper;
    if (s.gameOver) return;
    s.cursor.r = r; s.cursor.c = c;
    if (s.flagged[r][c]) { render(); return; }
    // 첫 클릭이면 mine 배치를 안전하게
    if (s.firstClick) {
      msPlaceMines(r, c);
      s.firstClick = false;
    }
    if (s.grid[r][c] === -1) {
      // Reveal all mines
      for (let r2=0; r2<s.N; r2++) for (let c2=0; c2<s.N; c2++)
        if (s.grid[r2][c2] === -1) s.revealed[r2][c2] = true;
      s.gameOver = true; s.won = false;
      toast('☠ Boom!', 2000); speak('Mine. Game over.');
      render(); return;
    }
    msFlood(r, c);
    msCheckWin();
    render();
    speak('Row ' + (r+1) + ' col ' + (c+1) + ': ' + (s.grid[r][c] === 0 ? 'safe' : s.grid[r][c] + ' nearby'));
  }
  function msFlood(r, c) {
    const s = state.minesweeper;
    if (r<0||r>=s.N||c<0||c>=s.N) return;
    if (s.revealed[r][c] || s.flagged[r][c]) return;
    if (s.grid[r][c] === -1) return;
    s.revealed[r][c] = true;
    if (s.grid[r][c] === 0) {
      for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++)
        if (dr || dc) msFlood(r+dr, c+dc);
    }
  }
  function msFlag(r, c) {
    const s = state.minesweeper;
    if (s.gameOver || s.revealed[r][c]) return;
    s.flagged[r][c] = !s.flagged[r][c];
    s.cursor.r = r; s.cursor.c = c;
    render();
    speak(s.flagged[r][c] ? 'Flagged' : 'Unflagged');
  }
  function msCheckWin() {
    const s = state.minesweeper;
    let safeCells = 0, safeRevealed = 0;
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      if (s.grid[r][c] !== -1) {
        safeCells++;
        if (s.revealed[r][c]) safeRevealed++;
      }
    }
    if (safeCells === safeRevealed) {
      s.gameOver = true; s.won = true;
      toast('☆ Solved!', 3000); speak('Solved. Congratulations.');
    }
  }

  // ============================================================
  // NONOGRAM
  // ============================================================
  // Nonogram target — from NONO_BY_DIFF based on difficulty

  function computeHints(grid, axis) {
    // axis: 'row' or 'col'
    const N = grid.length;
    const hints = [];
    if (axis === 'row') {
      for (let r=0; r<N; r++) {
        const line = grid[r];
        const groups = [];
        let cur = 0;
        for (let c=0; c<N; c++) {
          if (line[c]) cur++;
          else if (cur) { groups.push(cur); cur = 0; }
        }
        if (cur) groups.push(cur);
        hints.push(groups.length ? groups : [0]);
      }
    } else {
      for (let c=0; c<N; c++) {
        const groups = [];
        let cur = 0;
        for (let r=0; r<N; r++) {
          if (grid[r][c]) cur++;
          else if (cur) { groups.push(cur); cur = 0; }
        }
        if (cur) groups.push(cur);
        hints.push(groups.length ? groups : [0]);
      }
    }
    return hints;
  }

  function initNonogram() {
    if (state.nonogram) return;
    const target = NONO_BY_DIFF[state.difficulty.nonogram];
    const N = target.length;
    state.nonogram = {
      N,
      target,
      state: Array.from({length: N}, () => Array(N).fill(0)),
      rowHints: computeHints(target, 'row'),
      colHints: computeHints(target, 'col'),
      cursor: { r: 0, c: 0 },
      completedRows: new Set(),
      completedCols: new Set(),
    };
  }

  function renderNonogram() {
    const s = state.nonogram;
    // Column hints
    let colHtml = '';
    for (let c=0; c<s.N; c++) {
      const hints = s.colHints[c].join(' ');
      colHtml += `<div class="nono-hint-cell col">${hints.replace(/ /g, '<br/>')}</div>`;
    }
    // Row hints
    let rowHtml = '';
    for (let r=0; r<s.N; r++) {
      const hints = s.rowHints[r].join(' ');
      rowHtml += `<div class="nono-hint-cell row">${hints}</div>`;
    }
    // Grid
    let cellsHtml = '';
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      const v = s.state[r][c];
      const focused = (r === s.cursor.r && c === s.cursor.c) ? 'focused' : '';
      const cls = `nono-cell ${v===1?'filled':''} ${v===2?'x':''} ${focused}`;
      cellsHtml += `<div class="${cls}" onclick="nonoClick(${r},${c})" oncontextmenu="event.preventDefault();nonoX(${r},${c});return false"></div>`;
    }

    $('screen').innerHTML = `
      ${renderHeader('Reveal the picture', `${s.N} × ${s.N} · Row ${s.cursor.r+1}, Col ${s.cursor.c+1}`, `Stage 3 · Nonogram · ${DIFF_LABEL[state.difficulty.nonogram]}`)}
      <div class="tools-bar">
        <button class="tool-btn" onclick="nonoReadHints()"><span class="ico">📢</span>Read hints</button>
        <button class="tool-btn" onclick="nonoProgress()"><span class="ico">📊</span>Progress</button>
        <button class="tool-btn" onclick="nonoCheck()"><span class="ico">✓</span>Check</button>
        <button class="tool-btn" onclick="announceContextHelp()"><span class="ico">?</span>Help</button>
      </div>
      <div class="key-hints"><b>Tap</b> fill · <b>right-click</b> mark X · <b>F3</b> fill · <b>F4</b> mark</div>
      <div class="nono-wrap" style="grid-template-columns: 80px repeat(${s.N}, 1fr)">
        <div class="nono-hint-cell" style="grid-row:1;grid-column:1"></div>
        ${[...Array(s.N).keys()].map(c => `<div class="nono-hint-cell col" style="grid-row:1;grid-column:${c+2}">${s.colHints[c].join('<br/>')}</div>`).join('')}
        ${[...Array(s.N).keys()].map(r => `<div class="nono-hint-cell row" style="grid-row:${r+2};grid-column:1">${s.rowHints[r].join(' ')}</div>`).join('')}
        <div class="nono-grid-area" style="grid-row:2/span ${s.N};grid-column:2/span ${s.N};display:grid;grid-template-columns:repeat(${s.N},1fr);grid-template-rows:repeat(${s.N},1fr)">${cellsHtml}</div>
      </div>
      <div class="action-bar">
        <button class="primary-btn" onclick="nonoCheck()">Check</button>
        <button class="ghost-btn" onclick="state.nonogram=null;initNonogram();render()">Reset</button>
      </div>
      ${renderDotpadPreview()}
    `;
  }

  function nonoClick(r, c) {
    const s = state.nonogram;
    s.cursor.r = r; s.cursor.c = c;
    s.state[r][c] = s.state[r][c] === 1 ? 0 : 1;
    nonoCheckLineComplete(r, c);
    render();
    speak(s.state[r][c] === 1 ? 'Filled' : 'Empty');
  }

  // 행/열이 정답과 일치하면 자동 음성 알림 (한 번만)
  function nonoCheckLineComplete(r, c) {
    const s = state.nonogram;
    // Row r 체크
    if (!s.completedRows.has(r)) {
      let rowOk = true;
      for (let cc=0; cc<s.N; cc++) {
        if ((s.state[r][cc] === 1) !== (s.target[r][cc] === 1)) { rowOk = false; break; }
      }
      if (rowOk) {
        s.completedRows.add(r);
        setTimeout(() => speak(`Row ${r+1} complete.`), 200);
        toast(`✓ Row ${r+1} complete`, 1500);
      }
    }
    // Col c 체크
    if (!s.completedCols.has(c)) {
      let colOk = true;
      for (let rr=0; rr<s.N; rr++) {
        if ((s.state[rr][c] === 1) !== (s.target[rr][c] === 1)) { colOk = false; break; }
      }
      if (colOk) {
        s.completedCols.add(c);
        setTimeout(() => speak(`Column ${c+1} complete.`), 500);
        toast(`✓ Column ${c+1} complete`, 1500);
      }
    }
  }
  window.nonoCheckLineComplete = nonoCheckLineComplete;
  function nonoReadHints() {
    const s = state.nonogram;
    const rh = s.rowHints[s.cursor.r].join(' ');
    const ch = s.colHints[s.cursor.c].join(' ');
    const msg = `Row ${s.cursor.r+1} hint: ${rh}. Column ${s.cursor.c+1} hint: ${ch}.`;
    toast(msg, 4000); speak(msg);
  }
  function nonoProgress() {
    const s = state.nonogram;
    let correct = 0, total = 0;
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      if (s.target[r][c] === 1) {
        total++;
        if (s.state[r][c] === 1) correct++;
      }
    }
    const pct = total === 0 ? 0 : Math.round(100 * correct / total);
    const msg = `Progress: ${pct} percent. ${correct} of ${total} filled correctly.`;
    toast(msg, 3000); speak(msg);
  }
  window.nonoReadHints = nonoReadHints;
  window.nonoProgress = nonoProgress;

  function nonoX(r, c) {
    const s = state.nonogram;
    s.cursor.r = r; s.cursor.c = c;
    s.state[r][c] = s.state[r][c] === 2 ? 0 : 2;
    render();
    speak(s.state[r][c] === 2 ? 'X marked' : 'Cleared');
  }
  function nonoCheck() {
    const s = state.nonogram;
    let ok = true;
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      const expected = s.target[r][c] === 1;
      const actual = s.state[r][c] === 1;
      if (expected !== actual) { ok = false; }
    }
    if (ok) { toast('☆ Picture revealed!', 3000); speak('Solved.'); }
    else { toast('Not quite there'); speak('Not yet.'); }
  }

  // ============================================================
  // MAZE
  // ============================================================
  function initMaze() {
    const N = MAZE_BY_DIFF[state.difficulty.maze];
    // N은 홀수여야 함 (모두 홀수: 7, 11, 15)
    const grid = Array.from({length: N}, () => Array(N).fill(1));
    function carve(r, c) {
      grid[r][c] = 0;
      const dirs = [[-2,0],[2,0],[0,-2],[0,2]].sort(() => Math.random() - 0.5);
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr > 0 && nr < N-1 && nc > 0 && nc < N-1 && grid[nr][nc] === 1) {
          grid[r + dr/2][c + dc/2] = 0;
          carve(nr, nc);
        }
      }
    }
    carve(1, 1);
    state.maze = {
      N, grid,
      player: { r: 1, c: 1 },
      goal: { r: N-2, c: N-2 },
      won: false,
    };
  }

  function renderMaze() {
    const s = state.maze;
    let cellsHtml = '';
    for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
      let cls = 'maze-cell';
      if (s.grid[r][c] === 1) cls += ' wall';
      if (s.player.r === r && s.player.c === c) cls += ' player';
      if (s.goal.r === r && s.goal.c === c) cls += ' goal';
      cellsHtml += `<div class="${cls}"></div>`;
    }

    $('screen').innerHTML = `
      ${renderHeader('Navigate the maze', `${s.N} × ${s.N} · Player at row ${s.player.r+1}, col ${s.player.c+1}${s.won ? ' · ☆ Won!' : ''}`, `Stage 4 · Maze · ${DIFF_LABEL[state.difficulty.maze]}`)}
      <div class="tools-bar">
        <button class="tool-btn" onclick="mazeAutoStep()"><span class="ico">▶▶</span>Auto to fork</button>
        <button class="tool-btn" onclick="mazeDescribe()"><span class="ico">📢</span>Describe</button>
        <button class="tool-btn" onclick="announceContextHelp()"><span class="ico">?</span>Help</button>
      </div>
      <div class="key-hints"><b>F1</b> up · <b>F2</b> down · <b>Pan L</b> left · <b>Pan R</b> right · <b>Pan All</b> describe surroundings</div>
      <div class="maze-grid" style="grid-template-columns:repeat(${s.N},1fr)">${cellsHtml}</div>
      <div class="maze-controls">
        <button class="num-btn empty"></button>
        <button class="num-btn" onclick="mazeMove(-1, 0)">▲</button>
        <button class="num-btn empty"></button>
        <button class="num-btn" onclick="mazeMove(0, -1)">◀</button>
        <button class="num-btn" onclick="mazeMove(1, 0)">▼</button>
        <button class="num-btn" onclick="mazeMove(0, 1)">▶</button>
      </div>
      <div class="action-bar" style="margin-top:10px">
        <button class="primary-btn" onclick="state.maze=null;initMaze();render()">New Maze</button>
        <button class="ghost-btn" onclick="mazeDescribe()">Describe</button>
      </div>
      ${renderDotpadPreview()}
    `;
  }

  function mazeMove(dr, dc) {
    const s = state.maze;
    if (s.won) return;
    const nr = s.player.r + dr;
    const nc = s.player.c + dc;
    if (nr<0||nr>=s.N||nc<0||nc>=s.N) return;
    if (s.grid[nr][nc] === 1) { toast('Wall'); speak('Wall.'); return; }
    s.player.r = nr; s.player.c = nc;
    if (s.player.r === s.goal.r && s.player.c === s.goal.c) {
      s.won = true;
      toast('☆ Reached the goal!', 3000); speak('Goal reached.');
    }
    render();
    speak(['up','down','left','right'][dr === -1 ? 0 : dr === 1 ? 1 : dc === -1 ? 2 : 3] + (s.won ? '. Goal reached.' : '.'));
  }

  // 갈림길(2개 이상 출구) 또는 막다른 길까지 자동 이동
  function mazeAutoStep() {
    const s = state.maze;
    if (s.won) return;
    // 현재 진입 방향 추정: 이전 위치 기억
    let lastDr = 0, lastDc = 0;
    let steps = 0;
    while (steps < 50) {
      const exits = [];
      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      for (const [dr, dc] of dirs) {
        const nr = s.player.r + dr, nc = s.player.c + dc;
        if (nr<0||nr>=s.N||nc<0||nc>=s.N) continue;
        if (s.grid[nr][nc] === 0) exits.push([dr, dc]);
      }
      // 이전 방향 빼고 남은 길
      const forward = exits.filter(([dr, dc]) => !(dr === -lastDr && dc === -lastDc));
      if (forward.length === 0) break; // 막다른 길
      if (forward.length >= 2 && steps > 0) break; // 갈림길
      const [dr, dc] = forward[0];
      s.player.r += dr; s.player.c += dc;
      lastDr = dr; lastDc = dc;
      steps++;
      if (s.player.r === s.goal.r && s.player.c === s.goal.c) {
        s.won = true;
        toast('☆ Reached the goal!', 3000); speak('Goal reached.');
        break;
      }
    }
    render();
    const msg = `Moved ${steps} steps. Row ${s.player.r+1}, col ${s.player.c+1}.`;
    if (!s.won) speak(msg);
  }
  window.mazeAutoStep = mazeAutoStep;

  function mazeDescribe() {
    const s = state.maze;
    const dirs = [
      ['up', -1, 0],['down', 1, 0],
      ['left', 0, -1],['right', 0, 1]
    ];
    const open = dirs.filter(([_, dr, dc]) => {
      const nr = s.player.r + dr, nc = s.player.c + dc;
      return nr>=0 && nr<s.N && nc>=0 && nc<s.N && s.grid[nr][nc] === 0;
    }).map(d => d[0]);
    const dist = Math.abs(s.goal.r - s.player.r) + Math.abs(s.goal.c - s.player.c);
    const msg = `Player at row ${s.player.r+1} column ${s.player.c+1}. Open: ${open.join(', ') || 'none'}. Goal ${dist} steps away.`;
    toast(msg, 3500);
    speak(msg);
  }

  // ============================================================
  // DOT PAD PREVIEW + ACTUAL DISPLAY
  // ============================================================
  // Each Dot Pad cell = 2 cols × 3 rows of dots = 6 dots / cell
  // Dot Pad has 60 cells (30 cols × 2 rows) for text mode,
  // OR 300 cells (30 × 10) for graphic mode.
  // For puzzles we use graphic mode — 30 cells wide × 10 cells tall.
  // We'll preview a 30×3 strip (just one row of the puzzle status).

  function renderDotpadPreview() {
    // 30 cells wide, 1 row preview
    let cells = '';
    const data = getCurrentDotpadDots(); // 30×3 dots = 90 dots
    for (let i = 0; i < 30; i++) {
      const base = i * 3;
      let dots = '';
      // Each cell has 6 dots (2 cols × 3 rows). We use 1 col here.
      for (let d = 0; d < 3; d++) {
        const up = data[base + d] === 1;
        dots += `<div class="dot d${d*2+1} ${up?'up':''}"></div>`;
      }
      cells += `<div class="dp-cell">${dots}</div>`;
    }
    return `
      <div class="dotpad-preview">
        <div class="dotpad-preview-label">DOT PAD PREVIEW (${state.dotpadConnected ? 'live' : 'simulated'})</div>
        <div class="dotpad-preview-grid">${cells}</div>
      </div>
    `;
  }

  // Get a simple linear "row of dots" representing current puzzle state
  function getCurrentDotpadDots() {
    const out = new Array(90).fill(0);
    if (state.screen === 'sudoku') {
      const s = state.sudoku;
      const row = s.grid[s.cursor.r];
      for (let i = 0; i < s.N; i++) {
        const v = row[i];
        if (v) { out[i*3] = 1; out[i*3+1] = 1; out[i*3+2] = 1; }
        if (i === s.cursor.c) { out[i*3] = 1; out[i*3+2] = 1; }
      }
    } else if (state.screen === 'minesweeper') {
      const s = state.minesweeper;
      const row = s.grid[s.cursor.r];
      for (let i = 0; i < s.N; i++) {
        if (s.revealed[s.cursor.r][i]) {
          const v = row[i];
          if (v === -1) { out[i*3] = 1; out[i*3+1] = 1; out[i*3+2] = 1; } // mine
          else if (v > 0) { out[i*3] = 1; out[i*3+2] = 1; } // numeric
        } else if (s.flagged[s.cursor.r][i]) {
          out[i*3+1] = 1;
        }
        if (i === s.cursor.c) { out[i*3] = 1; out[i*3+2] = 1; }
      }
    } else if (state.screen === 'nonogram') {
      const s = state.nonogram;
      const row = s.state[s.cursor.r];
      for (let i = 0; i < s.N; i++) {
        if (row[i] === 1) { out[i*3] = 1; out[i*3+1] = 1; out[i*3+2] = 1; }
        else if (row[i] === 2) { out[i*3+1] = 1; }
        if (i === s.cursor.c) { out[i*3] = 1; out[i*3+2] = 1; }
      }
    } else if (state.screen === 'maze') {
      const s = state.maze;
      // Show player row
      const row = s.grid[s.player.r];
      for (let i = 0; i < Math.min(30, s.N); i++) {
        if (row[i] === 1) { out[i*3] = 1; out[i*3+1] = 1; out[i*3+2] = 1; }
        if (i === s.player.c) { out[i*3] = 1; out[i*3+1] = 1; out[i*3+2] = 1; }
        if (s.goal.r === s.player.r && i === s.goal.c) { out[i*3+1] = 1; }
      }
    }
    return out;
  }

  // ============================================================
  // DOT PAD ACTUAL DEVICE — graphic mode (multi-line)
  // ============================================================
  // Dot Pad graphic data: hex string, each byte = 1 cell (2×3 dot pattern).
  // 30 cols × 10 rows = 300 cells = 600 hex chars.
  function pushToDotpad() {
    if (!state.dotpadConnected || !window.DotPad) return;
    const hex = renderPuzzleAsGraphicHex();
    try {
      window.DotPad.sdk.displayGraphicData(hex);
    } catch(e) {
      console.warn('[DotPad] push failed:', e);
    }
  }

  // Build 30x10 grid hex from current puzzle
  function renderPuzzleAsGraphicHex() {
    // 300 cells, each 2 dots wide × 3 dots tall
    // Each cell encoded as 8-bit (dots 1-6 used; 7-8 ignored)
    const cells = new Array(300).fill(0);
    function setCell(col, row, dotsBitmask) {
      if (col<0||col>=30||row<0||row>=10) return;
      cells[row*30 + col] = dotsBitmask;
    }
    if (state.screen === 'sudoku') {
      const s = state.sudoku;
      for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
        const v = s.grid[r][c];
        let dots = 0;
        if (v) {
          // Simple mapping: dot 1 always up (cell occupied)
          dots |= 0x01;
          // Encode digit in dots 2-6 (binary 1-9 in 5 bits not used; just dot count)
          // Visual: 1 = top, 2 = top+mid, ... 6 = all six. 7,8,9 wrap.
          const n = Math.min(6, v);
          for (let i = 0; i < n; i++) dots |= (1 << i);
        }
        if (r === s.cursor.r && c === s.cursor.c) {
          dots |= 0x21; // dots 1 + 6 = bracket
        }
        setCell(c + 1, r, dots);
      }
    } else if (state.screen === 'minesweeper') {
      const s = state.minesweeper;
      for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
        let dots = 0;
        if (s.revealed[r][c]) {
          const v = s.grid[r][c];
          if (v === -1) dots = 0x3F; // all 6 dots = mine
          else if (v > 0) {
            // Use dot count = number
            const n = Math.min(6, v);
            for (let i = 0; i < n; i++) dots |= (1 << i);
          }
          // 0 = empty revealed = no dots
        } else if (s.flagged[r][c]) {
          dots = 0x12; // dots 2+5 = flag
        } else {
          dots = 0x09; // dots 1+4 = covered
        }
        if (r === s.cursor.r && c === s.cursor.c) {
          dots |= 0x21;
        }
        setCell(c + 1, r, dots);
      }
    } else if (state.screen === 'nonogram') {
      const s = state.nonogram;
      for (let r=0; r<s.N; r++) for (let c=0; c<s.N; c++) {
        let dots = 0;
        if (s.state[r][c] === 1) dots = 0x3F; // filled all 6
        else if (s.state[r][c] === 2) dots = 0x12; // X marker
        if (r === s.cursor.r && c === s.cursor.c) dots |= 0x21;
        setCell(c + 1, r, dots);
      }
    } else if (state.screen === 'maze') {
      const s = state.maze;
      // 15x15 maze — fits in 15 cells wide × 10 cells tall (we'll show rows around player)
      // Center view on player
      const viewRows = 10;
      const startR = Math.max(0, Math.min(s.N - viewRows, s.player.r - 5));
      for (let dr=0; dr<viewRows; dr++) {
        const r = startR + dr;
        if (r >= s.N) break;
        for (let c=0; c<Math.min(15, s.N); c++) {
          let dots = 0;
          if (s.grid[r][c] === 1) dots = 0x3F; // wall = solid
          if (s.goal.r === r && s.goal.c === c) dots = 0x12; // goal marker
          if (s.player.r === r && s.player.c === c) dots = 0x36; // player blob
          setCell(c + 1, dr, dots);
        }
      }
    }
    // Encode to hex
    let hex = '';
    for (const d of cells) hex += d.toString(16).padStart(2, '0').toUpperCase();
    return hex;
  }

  // ============================================================
  // DOT PAD INPUT — key handling
  // ============================================================
  // ============================================================
  // CONTEXT HELP (F3+F4) — A.T. Guys 스타일
  // ============================================================
  function getContextHelp() {
    if (state.screen === 'launcher') {
      return 'DotPuzzle Pack main menu. F1 previous game. F2 next game. F3 to start. Pan left and right also work. Press difficulty chip on screen to change. Press F3 plus F4 for help. Press F1 plus F4 to return here from any screen.';
    }
    if (state.screen === 'sudoku') {
      const s = state.sudoku;
      return `Sudoku ${s.N} by ${s.N}, difficulty ${DIFF_LABEL[state.difficulty.sudoku]}. F1 row up, F2 row down, pan left and right for columns. F3 cycles digit at cursor. F4 checks the puzzle. On screen, use Read row, What's missing, Check buttons. F1 plus F4 home. F3 plus F4 help.`;
    }
    if (state.screen === 'minesweeper') {
      const s = state.minesweeper;
      return `Minesweeper ${s.N} by ${s.N} with ${s.MINES} mines, difficulty ${DIFF_LABEL[state.difficulty.minesweeper]}. F1 row up, F2 row down, pan left and right for columns. F3 reveals current cell. F4 flags or unflags. First click is always safe. On screen use Safe hint and Read around for help. F1 plus F4 home. F3 plus F4 help.`;
    }
    if (state.screen === 'nonogram') {
      const s = state.nonogram;
      return `Nonogram ${s.N} by ${s.N}, difficulty ${DIFF_LABEL[state.difficulty.nonogram]}. F1 row up, F2 row down, pan left and right for columns. F3 fills or empties. F4 marks X or clears. Completed rows and columns are announced automatically. On screen use Read hints and Progress. F1 plus F4 home. F3 plus F4 help.`;
    }
    if (state.screen === 'maze') {
      const s = state.maze;
      return `Maze ${s.N} by ${s.N}, difficulty ${DIFF_LABEL[state.difficulty.maze]}. F1 move up, F2 move down, pan left for left, pan right for right. Pan all describes surroundings. On screen, Auto to fork advances to the next junction. F1 plus F4 home. F3 plus F4 help.`;
    }
    return 'DotPuzzle Pack. F1 plus F4 to return home. F3 plus F4 for help.';
  }

  function announceContextHelp() {
    const text = getContextHelp();
    if (state.ttsOn) { try { window.speechSynthesis.cancel(); } catch(e){} speak(text); }
    if (state.dotpadConnected && typeof brailleSetText === 'function') {
      // 점자 영역은 brailleSetText 없으니 displayTextData 직접 호출
      try {
        // 압축된 키 안내만 짧게 점자에
        const compact = state.screen === 'launcher'
          ? 'Menu F3 start F1/F2 nav'
          : state.screen + ' F3 sel F4 mark F1+F4 home';
        // No braille helper in this app yet — display via Dot Pad text line
        if (window.DotPad && window.DotPad.sdk && window.DotPad.sdk.displayTextData) {
          // Convert text to braille hex by simple ascii table (handled later if liblouis added)
          // For now, push the text via Dot Pad text area as raw text-mode bytes is non-trivial.
          // Skip braille — voice carries the help.
        }
      } catch(e){}
    }
    toast('Help · F1+F4 home, F3+F4 help', 3000);
  }

  function goHomeShortcut() {
    if (state.screen === 'launcher') {
      announceContextHelp(); // 이미 홈이면 help 발화
      return;
    }
    speak('Home.');
    goLauncher();
  }
  window.announceContextHelp = announceContextHelp;
  window.goHomeShortcut = goHomeShortcut;

  function onDotpadKey(device, keyCode, msg) {
    if (!window.DotPad) return;
    const KC = window.DotPad.KeyCodes;
    // 전역 콤보 키 — A.T. Guys 패턴
    if (keyCode === KC.KeyFunction34) { announceContextHelp(); return; }
    if (keyCode === KC.KeyFunction14) { goHomeShortcut(); return; }
    if (state.screen === 'launcher') {
      // F1/F2 = navigate game cards · F3 = select
      const cards = Array.from(document.querySelectorAll('.game-card'));
      if (keyCode === KC.KeyFunction1) state.dotpadCursor = (state.dotpadCursor - 1 + cards.length) % cards.length;
      else if (keyCode === KC.KeyFunction2) state.dotpadCursor = (state.dotpadCursor + 1) % cards.length;
      else if (keyCode === KC.KeyFunction3) { cards[state.dotpadCursor]?.click(); return; }
      dotpadHighlight();
      speak(cards[state.dotpadCursor]?.querySelector('.game-card-title')?.textContent || '');
      return;
    }
    // Game screens
    if (keyCode === KC.PanningAll) {
      // Replay context
      if (state.screen === 'maze') return mazeDescribe();
      const p = document.querySelector('.game-sub')?.textContent || '';
      speak(p);
      return;
    }
    if (state.screen === 'sudoku') {
      const s = state.sudoku;
      if (keyCode === KC.KeyFunction1) s.cursor.r = (s.cursor.r - 1 + s.N) % s.N;
      else if (keyCode === KC.KeyFunction2) s.cursor.r = (s.cursor.r + 1) % s.N;
      else if (keyCode === KC.PanningLeft) s.cursor.c = (s.cursor.c - 1 + s.N) % s.N;
      else if (keyCode === KC.PanningRight) s.cursor.c = (s.cursor.c + 1) % s.N;
      else if (keyCode === KC.KeyFunction3) {
        if (!s.given[s.cursor.r][s.cursor.c]) {
          s.grid[s.cursor.r][s.cursor.c] = (s.grid[s.cursor.r][s.cursor.c] + 1) % (s.N + 1);
        }
      } else if (keyCode === KC.KeyFunction4) {
        sudokuCheck(); return;
      }
      render();
      const cell_v = s.grid[s.cursor.r][s.cursor.c];
      speak('Row ' + (s.cursor.r+1) + ' col ' + (s.cursor.c+1) + ': ' + (cell_v || 'empty'));
    } else if (state.screen === 'minesweeper') {
      const s = state.minesweeper;
      if (keyCode === KC.KeyFunction1) s.cursor.r = (s.cursor.r - 1 + s.N) % s.N;
      else if (keyCode === KC.KeyFunction2) s.cursor.r = (s.cursor.r + 1) % s.N;
      else if (keyCode === KC.PanningLeft) s.cursor.c = (s.cursor.c - 1 + s.N) % s.N;
      else if (keyCode === KC.PanningRight) s.cursor.c = (s.cursor.c + 1) % s.N;
      else if (keyCode === KC.KeyFunction3) { msClick(s.cursor.r, s.cursor.c); return; }
      else if (keyCode === KC.KeyFunction4) { msFlag(s.cursor.r, s.cursor.c); return; }
      render();
      const v = s.grid[s.cursor.r][s.cursor.c];
      const status = s.revealed[s.cursor.r][s.cursor.c] ? (v === -1 ? 'mine' : v > 0 ? v + ' nearby' : 'empty') :
        s.flagged[s.cursor.r][s.cursor.c] ? 'flagged' : 'hidden';
      speak('Row ' + (s.cursor.r+1) + ' col ' + (s.cursor.c+1) + ': ' + status);
    } else if (state.screen === 'nonogram') {
      const s = state.nonogram;
      if (keyCode === KC.KeyFunction1) s.cursor.r = (s.cursor.r - 1 + s.N) % s.N;
      else if (keyCode === KC.KeyFunction2) s.cursor.r = (s.cursor.r + 1) % s.N;
      else if (keyCode === KC.PanningLeft) s.cursor.c = (s.cursor.c - 1 + s.N) % s.N;
      else if (keyCode === KC.PanningRight) s.cursor.c = (s.cursor.c + 1) % s.N;
      else if (keyCode === KC.KeyFunction3) { nonoClick(s.cursor.r, s.cursor.c); return; }
      else if (keyCode === KC.KeyFunction4) { nonoX(s.cursor.r, s.cursor.c); return; }
      render();
      const v = s.state[s.cursor.r][s.cursor.c];
      const status = v === 1 ? 'filled' : v === 2 ? 'x marked' : 'empty';
      const hint = 'Row hint ' + s.rowHints[s.cursor.r].join(' ') + '. Col hint ' + s.colHints[s.cursor.c].join(' ');
      speak('Row ' + (s.cursor.r+1) + ' col ' + (s.cursor.c+1) + ': ' + status + '. ' + hint);
    } else if (state.screen === 'maze') {
      if (keyCode === KC.KeyFunction1) mazeMove(-1, 0);
      else if (keyCode === KC.KeyFunction2) mazeMove(1, 0);
      else if (keyCode === KC.PanningLeft) mazeMove(0, -1);
      else if (keyCode === KC.PanningRight) mazeMove(0, 1);
    }
  }

  function dotpadHighlight() {
    document.querySelectorAll('.dotpad-focus').forEach(el => el.classList.remove('dotpad-focus'));
    if (state.screen === 'launcher') {
      const cards = document.querySelectorAll('.game-card');
      if (cards[state.dotpadCursor]) cards[state.dotpadCursor].classList.add('dotpad-focus');
    }
  }

  // ============================================================
  // DOT PAD CONNECT
  // ============================================================
  function dotpadAvailable() { return !!(window.DotPad && window.DotPad.sdk); }
  function openDpOverlay() { $('dp-overlay').classList.add('active'); }
  function closeDpOverlay() { $('dp-overlay').classList.remove('active'); }

  async function connectBle() {
    if (!dotpadAvailable()) { alert('Dot Pad SDK not loaded'); return; }
    try {
      const device = await window.DotPad.scanner.startBleScan();
      if (!device) return;
      window.DotPad.sdk.setCallBack(onDotpadMessage, onDotpadKey);
      const connected = await window.DotPad.sdk.connectBleDevice(device);
      if (connected) {
        state.dotpadConnected = true;
        state.dotpadDevice = connected;
        state.dotpadName = device.name || 'Dot Pad';
        closeDpOverlay();
        speak('Dot Pad connected. F1 and F2 move cursor. F3 select. F4 toggle mark.');
        render();
      }
    } catch (e) {
      alert('BLE failed: ' + (e.message || e));
    }
  }

  async function connectUsb() {
    if (!dotpadAvailable()) { alert('Dot Pad SDK not loaded'); return; }
    try {
      const device = await window.DotPad.scanner.startUsbScan();
      if (!device) return;
      window.DotPad.sdk.setCallBack(onDotpadMessage, onDotpadKey);
      const connected = await window.DotPad.sdk.connectUsbDevice(device);
      if (connected) {
        state.dotpadConnected = true;
        state.dotpadDevice = connected;
        state.dotpadName = 'USB Dot Pad';
        closeDpOverlay();
        speak('Dot Pad connected. F1 and F2 move cursor. F3 select. F4 toggle mark.');
        render();
      }
    } catch (e) {
      alert('USB failed: ' + (e.message || e));
    }
  }

  function onDotpadMessage(device, code, msg) {
    if (!window.DotPad) return;
    const DC = window.DotPad.DataCodes || {};
    if (code === DC.Connected) {
      state.dotpadConnected = true;
      render();
    } else if (code === DC.Disconnected) {
      state.dotpadConnected = false;
      render();
    }
  }

  // ============================================================
  // KEYBOARD SHORTCUTS (desktop testing)
  // ============================================================
  document.addEventListener('keydown', (e) => {
    // 전역 단축키 (인풋 제외)
    if (!e.target.matches('input, textarea')) {
      if (e.key === '?' || e.key === 'h' || e.key === 'H') {
        e.preventDefault();
        announceContextHelp();
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        goHomeShortcut();
        return;
      }
    }
    if (state.screen === 'maze' && !e.target.matches('input, textarea')) {
      if (e.key === 'ArrowUp') { e.preventDefault(); mazeMove(-1, 0); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); mazeMove(1, 0); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); mazeMove(0, -1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); mazeMove(0, 1); }
    } else if (state.screen === 'sudoku' && !e.target.matches('input, textarea')) {
      const s = state.sudoku;
      if (e.key === 'ArrowUp') { e.preventDefault(); s.cursor.r = (s.cursor.r - 1 + s.N) % s.N; render(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); s.cursor.r = (s.cursor.r + 1) % s.N; render(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); s.cursor.c = (s.cursor.c - 1 + s.N) % s.N; render(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); s.cursor.c = (s.cursor.c + 1) % s.N; render(); }
      else if (/^[0-9]$/.test(e.key)) {
        const n = parseInt(e.key);
        if (n <= s.N) sudokuInput(n);
      }
    } else if ((state.screen === 'minesweeper' || state.screen === 'nonogram') && !e.target.matches('input, textarea')) {
      const s = state.screen === 'minesweeper' ? state.minesweeper : state.nonogram;
      if (e.key === 'ArrowUp') { e.preventDefault(); s.cursor.r = (s.cursor.r - 1 + s.N) % s.N; render(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); s.cursor.r = (s.cursor.r + 1) % s.N; render(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); s.cursor.c = (s.cursor.c - 1 + s.N) % s.N; render(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); s.cursor.c = (s.cursor.c + 1) % s.N; render(); }
      else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (state.screen === 'minesweeper') msClick(s.cursor.r, s.cursor.c);
        else nonoClick(s.cursor.r, s.cursor.c);
      } else if (e.key === 'f' || e.key === 'F') {
        if (state.screen === 'minesweeper') msFlag(s.cursor.r, s.cursor.c);
        else nonoX(s.cursor.r, s.cursor.c);
      }
    }
  });

  // ============================================================
  // BOOT
  // ============================================================
  // expose for inline onclick handlers
  window.startGame = startGame;
  window.goLauncher = goLauncher;
  window.toggleTts = toggleTts;
  window.openDpOverlay = openDpOverlay;
  window.closeDpOverlay = closeDpOverlay;
  window.connectBle = connectBle;
  window.connectUsb = connectUsb;
  window.sudokuClick = sudokuClick;
  window.sudokuInput = sudokuInput;
  window.sudokuCheck = sudokuCheck;
  window.sudokuReset = sudokuReset;
  window.msClick = msClick;
  window.msFlag = msFlag;
  window.nonoClick = nonoClick;
  window.nonoX = nonoX;
  window.nonoCheck = nonoCheck;
  window.mazeMove = mazeMove;
  window.mazeDescribe = mazeDescribe;
  window.initMinesweeper = initMinesweeper;
  window.initMaze = initMaze;
  window.initNonogram = initNonogram;
  window.state = state;

  render();
  </script>
</body>
